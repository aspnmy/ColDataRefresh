[package]
name = "coldatafresh"
version = "5.0.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
ctrlc = "3.4"
rayon = "1.10"
walkdir = "2.5"
chrono = "0.4"
regex-lite = "0.1"
log = "0.4"
env_logger = "0.11"
filetime = "0.2"
serde_json = "1.0"
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Foundation",
]}

[target.'cfg(unix)'.dependencies]
libc = "0.2"