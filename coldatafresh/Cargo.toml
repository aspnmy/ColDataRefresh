[package]
name = "coldatafresh"
version = "4.7.0"
edition = "2024"

[dependencies]
# 异步I/O
async-std = { version = "1.12", features = ["attributes"] }
# 命令行参数解析
clap = { version = "4.5", features = ["derive"] }
# CRC32校验和
crc32fast = "1.4"
# 并发处理
rayon = "1.10"
# 日志记录
log = "0.4"
env_logger = "0.11"
# 系统调用
libc = "0.2"
# Windows系统调用
windows = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_Foundation"] }
# 文件系统操作
walkdir = "2.5"
# 跨平台路径处理
pathdiff = "0.2"
# 错误处理
thiserror = "1.0"
